name: WifiAutoswitch
options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: WifiAutoswitch
    PRODUCT_BUNDLE_IDENTIFIER: com.ramiro.wifiautoswitch
    MARKETING_VERSION: "0.1.1"          # default; build.sh overrides from the git tag
    CURRENT_PROJECT_VERSION: "2"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
targets:
  WifiAutoswitch:
    type: application
    platform: macOS
    sources:
      - path: src
      - path: Resources
    info:
      path: Support/Info.plist          # generated by XcodeGen (gitignored)
      properties:
        CFBundleName: WifiAutoswitch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSLocationUsageDescription: "Read nearby Wi-Fi network names to switch between home Wi-Fi and the iPhone hotspot."
        NSLocationWhenInUseUsageDescription: "Read nearby Wi-Fi network names to switch between home Wi-Fi and the iPhone hotspot."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Read nearby Wi-Fi network names in the background to switch between home Wi-Fi and the iPhone hotspot."
schemes:
  WifiAutoswitch:
    build:
      targets:
        WifiAutoswitch: all
    run:
      config: Release
